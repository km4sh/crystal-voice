name: release
on:
  push:
    tags: [ 'v*' ]
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --target CrystalVoice MicVSTTests --parallel 4
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: SHA256
        id: sha
        shell: pwsh
        run: '"hash=$((Get-FileHash build/CrystalVoice_artefacts/Release/CrystalVoice.exe -Algorithm SHA256).Hash)" >> $env:GITHUB_OUTPUT'
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/CrystalVoice_artefacts/Release/CrystalVoice.exe
            LICENSE
          body: |
            **Crystal Voice ${{ github.ref_name }}** — portable Windows x64 build, statically linked.
            Requires a virtual audio cable and separately installed VST3 effects.
            [Setup and source](https://github.com/km4sh/crystal-voice#readme).
            This executable is unsigned.
            **SHA-256** (`CrystalVoice.exe`): `${{ steps.sha.outputs.hash }}`
